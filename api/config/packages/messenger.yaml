framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Route your messages to the transports
            Ibs\Context\Communication\Service\Message\SendNotificationEnvelope: async

when@test:
    framework:
        messenger:
            transports:
                # Keeps ROUTINE dispatch genuinely queued (not auto-handled) without touching a real broker/DB.
                async: 'in-memory://'
                failed: 'in-memory://'
