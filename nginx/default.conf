server {
    listen 80;
    server_name localhost;

    # Корень для статики фронтенда
    root /var/www/html/frontend;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: запросы идут в public/, при отсутствии файла – на index.php
    location /api/ {
        alias /var/www/html/public;
        try_files $uri /index.php$is_args$args;
    }

    # Ассеты бандлов (Swagger и т.д.)
    location /bundles/ {
        alias /var/www/html/public/bundles/;
        expires max;
        access_log off;
    }

    # Главный PHP-обработчик (ловит внутренние редиректы на /index.php)
    location ~ ^/index\.php(/|$) {
        fastcgi_pass ibs-php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        internal;   # доступен только через внутренние редиректы
    }

    # Запрещаем прямое обращение к любым другим .php
    location ~ \.php$ {
        return 404;
    }
}