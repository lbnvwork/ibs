# docker-compose.override.yml — только для локальной разработки
services:
  php:
    environment:
      APP_ENV: dev                 # переопределяем на dev
      APP_DEBUG: 1                 # включаем отладку
    command: >
      sh -c "composer install --no-interaction --prefer-dist
      && php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
      && php-fpm"
    # composer install без --no-dev => dev-пакеты остаются

  node:
    command: sh -c "npm install && npm run dev"   # dev-сервер вместо сборки
    ports:
      - "5174:5173"                # пробрасываем порт наружу
    restart: unless-stopped

  nginx:
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/public:/var/www/html/public:ro
      # НЕ подключаем том frontend_dist, т.к. фронт раздаёт Vite
    depends_on:
      php:
        condition: service_started
      node:
        condition: service_started   # ждём старта dev-сервера, а не завершения