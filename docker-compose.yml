services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      MAX_API_URL: ${MAX_API_URL}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_BOT_NICKNAME: ${MAX_BOT_NICKNAME:-}
      COMPOSER_ALLOW_SUPERUSER: 1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    command: >
      sh -c "composer install --no-dev --no-scripts --optimize-autoloader --no-interaction
      && php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration --env=prod
      && php bin/console cache:clear --env=prod --no-debug
      && php bin/console cache:warmup --env=prod
      && php-fpm"
    restart: unless-stopped

  messenger-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      MAX_API_URL: ${MAX_API_URL}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      php:
        condition: service_started
    networks:
      - default
    # Consumes the async/failed Messenger transports (ROUTINE notifications, etc).
    # time-limit recycles the worker periodically to shed accumulated memory; restart: unless-stopped brings it back up.
    command: >
      sh -c "php bin/console messenger:consume async failed --time-limit=3600 --memory-limit=128M -vv --env=prod"
    restart: unless-stopped

  max-updates-listener:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      MAX_API_URL: ${MAX_API_URL}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      php:
        condition: service_started
    networks:
      - default
    # Непрерывный Long Polling: опрашивает GET /updates и сохраняет контакты
    # пациентов, подключающихся к боту по диплинку.
    command: >
      sh -c "php bin/console app:communication:collect-max-contacts --loop --timeout=25 --env=prod"
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
    restart: unless-stopped

  node:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_dist:/app/dist
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    command: sh -c "npm ci && npm run build"
    networks:
      - default
    restart: "no"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/public:/var/www/html/public:ro
      - frontend_dist:/var/www/html/frontend:ro
    ports:
      - "${APP_PORT:-8081}:80"
    depends_on:
      php:
        condition: service_started
      node:
        condition: service_completed_successfully
    networks:
      - default
    restart: unless-stopped

  # E2E-стенд (Playwright). Запускается по требованию:
  #   docker compose run --rm e2e npx playwright test
  # Имя образа формируется автоматически: ${COMPOSE_PROJECT_NAME}-e2e.
  e2e:
    build: ./tests/e2e
    # Профиль: `docker compose up` не стартует e2e — тесты гоняются по требованию.
    profiles: ["e2e"]
    working_dir: /e2e
    volumes:
      - ./tests/e2e:/e2e
      - e2e_node_modules:/e2e/node_modules
    networks:
      - default
    # Chromium в Docker требует общего IPC, иначе возможны падения по памяти.
    ipc: host
    command: npx playwright test
    restart: "no"

volumes:
  db_data:
  frontend_dist:
  e2e_node_modules:

networks:
  default:
    external: true
    name: app-network