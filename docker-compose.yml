services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ibs-php
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      COMPOSER_ALLOW_SUPERUSER: 1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    command: >
      sh -c "composer install --no-dev --no-scripts --optimize-autoloader --no-interaction
      && php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration --env=prod
      && php bin/console cache:clear --env=prod --no-debug
      && php bin/console cache:warmup --env=prod
      && php-fpm"
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: ibs-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
    restart: unless-stopped

  node:
    image: node:20-alpine
    container_name: ibs-node
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_dist:/app/dist
    command: sh -c "npm ci && npm run build"
    networks:
      - default
    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: ibs-nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/public:/var/www/html/public:ro
      - frontend_dist:/var/www/html/frontend:ro
    ports:
      - "8081:80"
    depends_on:
      php:
        condition: service_started
      node:
        condition: service_completed_successfully
    networks:
      - default
    restart: unless-stopped

volumes:
  db_data:
  frontend_dist:

networks:
  default:
    external: true
    name: app-network