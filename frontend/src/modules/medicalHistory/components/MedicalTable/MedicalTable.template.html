<div class="medical-data">
    <div class="medical-data-header">
        <h3>Медицинские данные</h3>
        <div class="medical-data-actions">
            <button class="btn-add-test" @click="$emit('open-test-modal')">Добавить анализ</button>
            <button class="btn-add-appointment" @click="$emit('open-appointment-modal')">Добавить назначение</button>
        </div>
    </div>
    <MnoChart
        v-if="!hideChart && chartData.length > 0"
        :data="chartData"
        :mno-from="mnoFrom"
        :mno-to="mnoTo"
    />
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Дата</th>
                    <th>Показатели</th>
                    <th>Принимаемая доза</th>
                    <th>Назначенная доза</th>
                    <th v-if="!hideRecommendations">Рекомендации</th>
                    <th v-if="!hideComment">Комментарий</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="(data, index) in store.events" :key="index" :class="{ 'appointment-row': data.type === 'appointment' }">
                    <td>{{ data.displayDate }}</td>
                    <td>
                        <span v-if="data.type !== 'appointment'" v-html="buildIndicatorsFromRow(data)"></span>
                        <span v-else>—</span>
                    </td>
                    <td>{{ data.currentDose }}</td>
                    <td>{{ data.prescribedDose }}</td>
                    <td v-if="!hideRecommendations" class="recommendations">{{ data.recommendations }}</td>
                    <td v-if="!hideComment" class="comment">{{ data.comment }}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
