<div class="modal-overlay">
    <div class="modal-content">
        <h2>Добавить анализ</h2>

        <div class="form-group">
            <label>Дата анализа:</label>
            <input type="date" v-model="creationDt" class="form-control" />
            <span v-if="fieldErrors.creationDt" class="field-error">{{ fieldErrors.creationDt }}</span>
        </div>

        <div class="form-group">
            <label>МНО (0.8–10.0):</label>
            <input type="number" step="0.1" v-model.number="mno" class="form-control" />
            <span v-if="fieldErrors.mno" class="field-error">{{ fieldErrors.mno }}</span>
        </div>

        <div class="form-group">
            <label>Принимаемая доза (таб./сут):</label>
            <input type="number" step="0.25" v-model.number="doze" class="form-control" max="10" />
            <span v-if="fieldErrors.doze" class="field-error">{{ fieldErrors.doze }}</span>
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" v-model="enableAlternation" @change="onAlternationToggle" />
                Чередование (через день)
            </label>
        </div>
        <div class="form-group" v-if="enableAlternation">
            <label>Отклонение второй дозы:</label>
            <select v-model="alternationDelta" class="form-control">
                <option value="" disabled>Выберите отклонение</option>
                <option value="0.25">Больше на 0,25 (четвертинку)</option>
                <option value="-0.25">Меньше на 0,25 (четвертинку)</option>
                <option value="0.5">Больше на 0,5 (половинку)</option>
                <option value="-0.5">Меньше на 0,5 (половинку)</option>
            </select>
            <span v-if="fieldErrors.alternationDelta" class="field-error">{{ fieldErrors.alternationDelta }}</span>
            <small v-if="dose2 !== null">Вторая доза: {{ dose2 }} таб./сут</small>
        </div>

        <div class="form-group">
            <label>Сообщение пациенту:</label>
            <textarea v-model="comment" rows="3" class="form-control" @input="markCommentDirty"></textarea>
        </div>

        <div v-if="saveError" class="save-error">{{ saveError }}</div>

        <div class="modal-actions">
            <button class="btn-save" @click="save">Сохранить</button>
            <button class="btn-cancel" @click="$emit('close')">Отмена</button>
        </div>
    </div>
</div>
