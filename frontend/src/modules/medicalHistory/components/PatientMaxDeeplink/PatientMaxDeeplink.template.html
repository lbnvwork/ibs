<div class="patient-info-compact max-deeplink">
    <div class="treatment-section-header">
        <h3>Ссылка для мессенджера MAX</h3>
    </div>

    <div v-if="bound !== null" class="info-row">
        <div class="info-group">
            <label>Статус:</label>
            <span v-if="bound">чат привязан</span>
            <span v-else>чат не привязан</span>
        </div>
    </div>

    <div v-if="url" class="info-row">
        <div class="info-group max-deeplink-link">
            <label>Ссылка:</label>
            <a :href="url" target="_blank" rel="noopener noreferrer">{{ url }}</a>
            <button type="button" class="btn-save-treatment" @click="copyLink">Копировать</button>
            <span v-if="copyFeedback === 'copied'" class="max-deeplink-hint">Скопировано</span>
            <span v-else-if="copyFeedback === 'fallback'" class="max-deeplink-hint">Скопируйте вручную</span>
        </div>
    </div>

    <div v-if="loading" class="info-row">Загрузка…</div>
    <div v-if="error" class="treatment-form-error">{{ error }}</div>

    <div class="info-row">
        <button type="button" class="btn-save-treatment" @click="fetchDeeplink">
            {{ url ? 'Обновить ссылку' : 'Получить ссылку' }}
        </button>
    </div>
</div>
