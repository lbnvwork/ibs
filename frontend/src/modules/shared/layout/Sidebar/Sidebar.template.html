<div class="sidebar" :class="{ 'sidebar--text': isBakulevo }" aria-label="Navigation sidebar">
    <div v-if="isBakulevo" class="sidebar__logo" aria-hidden="true">
        <svg class="logo-icon" viewBox="0 0 24 24">
            <path d="M12 2C8.5 6 4 10.5 4 15a8 8 0 0 0 16 0c0-4.5-4.5-9-8-13z" stroke="currentColor" stroke-width="2" fill="none"/>
        </svg>
        <span class="logo-text">Warfarin manager</span>
    </div>

    <button
        :title="backButtonTitle"
        :class="{ 'disabled-button': !isBackButtonActive }"
        @click="handleBackButton"
    >
        <svg class="icon" viewBox="0 0 24 24">
            <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" fill="none"/>
        </svg>
        <span v-if="isBakulevo" class="label">Назад</span>
    </button>

    <template v-for="(item, index) in sidebarItems" :key="index">
        <button
                v-if="item.type === 'button'"
                :title="item.title"
                @click="handleButtonClick(item)"
                :class="{ 'disabled-button': item.disabled }"
        >
            <svg class="icon" viewBox="0 0 24 24" v-html="item.icon"></svg>
            <span v-if="isBakulevo" class="label">{{ item.label }}</span>
        </button>
        <div v-else-if="item.type === 'divider'" class="divider"></div>
    </template>

    <div v-if="isBakulevo" class="sidebar__support">
        <span class="support-title">Служба поддержки</span>
        <span class="support-phone">8 (800) 123-45-67</span>
    </div>
</div>
